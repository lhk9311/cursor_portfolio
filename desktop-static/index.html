<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.YOUNG'S PORTFOLIO — Desktop Header &amp; Hero</title>
    <!-- Montserrat: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Pretendard: CDN (@font-face 스타일 시트) -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="desktop-header">
      <div class="desktop-header-inner">
        <div class="logo">
          <img
            class="logo-img"
            src="/images/logo.svg"
            alt="J.YOUNG'S PORTFOLIO"
            width="226"
            height="34"
          />
        </div>
        <nav class="gnb" aria-label="주요 메뉴">
          <a class="gnb-link" href="#">HOME</a>
          <a class="gnb-link" href="#">ABOUT</a>
          <a class="gnb-link" href="#">SKILL</a>
          <a class="gnb-link" href="#">PROJECT</a>
          <a class="gnb-link" href="#">UIUX</a>
          <a class="gnb-link" href="#">CONTACT</a>
        </nav>
      </div>
    </header>

    <section class="desktop-section-hero">
      <div class="hero-inner">
        <div class="hero-main-title">
          <p class="hero-main-title-text">
            UI / UX<br />
            FRONTEND<br />
            INSTRUCTOR
          </p>
        </div>
        <div class="hero-sub-text">
          <p class="hero-sub-text-body">
            We train professionals by creating high-quality portfolios through practical
            training starting from the basics!
          </p>
        </div>
      </div>
      <div class="hero-img">
        <img
          class="hero-img-vector"
          src="/images/hero-img.svg"
          width="932"
          height="984"
          alt=""
        />
      </div>
    </section>
  </body>
</html>
